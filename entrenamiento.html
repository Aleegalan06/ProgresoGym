<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProgresoGym</title>
    <link rel="stylesheet" href="styleEntrenamiento.css">
</head>
<body>
    <form action="#" method="get">
        <input type="text" id="nombreEjercicio" name="nombreEjercicio" placeholder="Nombre del Ejercicio"><br>
        <input type="text" id="pesoEjercicio" name="pesoEjercicio" placeholder="Peso: KG"><br>
        <input type="number" id="numeroSeries" name="numeroSeries" placeholder="Numero de Series"><br>
        <input type="number" name="numeroRepes" id="numeroRepes" placeholder="Numero de Repeticiones"><br>
        
        <span id="contadorEjercicios">Ejercicios : 0</span>         
        <input type="button" value="Añadir" id="añadirEj"><br>
        <input type="button" value="Terminar entrenamiento" id="terminarEntrenamiento">
    </form>
    <script src="./entrenamiento.js"></script>
</body>
</html>
